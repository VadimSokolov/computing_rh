 "description": "The Riemann Hypothesis can be restated as the positivity of a measure, the Thorin measure of a ratio of values of Riemann's Xi function. This book computes that measure from Pólya's integral for Xi, without primes or a list of zeros, in certified ball arithmetic, and asks what such computations can and cannot teach about the zeros.\n\nA certified zero off the critical line would refute the hypothesis, but no finite computation can prove it. From the zeros verified up to height 3 × 10^12 the book certifies that the derivatives of the heat trace have the predicted signs up to order 1.16 × 10^25, and proves that such finite positivity tests cannot settle it: a perturbation of Xi with the same zeros below a large height, and zeros off the line above it, passes them. No proof of the hypothesis is claimed.\n\nNew results: the reciprocal Xi function at x to the power p is hyperbolically completely monotone exactly when the absolute value of p is at most one minus twice the largest zero angle over pi; at the basepoint one the Thorin density is certified smallest at the origin, so the shifted clock is a stable variable plus a generalized gamma convolution; between the basepoints one half and one the shifted clocks are almost generalized gamma convolutions, unconditionally; the clock of Pólya's Bessel function is the hitting time of an explicit diffusion; adjacent real zeros of a polynomial cannot meet under the backward heat flow before an explicit time; and the Pólya law lies within 2 × 10^-6 in total variation of the ferromagnetic laws of Lee and Yang, a distance that is zero exactly under the hypothesis.\n\nThe book is in three volumes. Volume I, Representations of Xi, Thorin Measures and the Reciprocal Xi Function, develops the theory: the analytic and probabilistic representations of Xi, infinite divisibility, generalised gamma convolutions and the Bondesson hierarchy, the heat trace, the reciprocal zeta function, the basepoints and the critical strip, Dedekind eta and Dirichlet L functions, hitting times and Krein strings, extreme value and ferromagnetic laws with a two spin Lee and Yang form of the hypothesis, and Pólya and Haseo Ki on the zeros of entire functions. Volume II, Cauchy Deconvolution and Certified Computation, holds the computations: what computation can and cannot decide, Xi in ball arithmetic, the Thorin measure at finite resolution, the de Bruijn Newman flow and the barrier method in Thorin form, the Thorin phase diagram, Cauchy deconvolution from the level one measure down to the zeros (the backward Cauchy flow, the explicit formula as a deconvolution, particle filters and the Balazard, Saias and Yor criterion by Monte Carlo), Weil positivity in the windows of Yoshida and Zhu, truncations and friable approximants of Xi with certified real zeros, approximating clocks, and Ramanujan's Delta in Thorin form. Volume III, Is There a Path? Routes to RH from the Thorin Programme, asks whether the programme leads to a proof, and collects the routes, the filters that test them, the quasi Riemann hypothesis, Iwaniec's approach, the birth and death chain of the zeros, and the final assessment of what is proved and what is open.\n\nThe zero free half plane Re s > 7/8 for the Riemann zeta function and every Dirichlet L function is a theorem of OpenAI (2026), formalised in Lean. The book draws its consequences: a principal signal for zeta, the sliver and Mertens estimate, and the Thorin property at every basepoint above 7/8, with Volume III following the routes that start from it.\n\nThe scripts and data files behind the tables and figures are in the book's repository https://github.com/VadimSokolov/computing_rh, listed in code/README.md.",
