 "description": "The Riemann Hypothesis can be restated as the positivity of a measure, the Thorin measure of a ratio of values of Riemann's Xi function. This book computes that measure from Pólya's integral for Xi, without primes or a list of zeros, in certified ball arithmetic, and asks what such computations can and cannot teach about the zeros.\n\nA certified zero off the critical line would refute the hypothesis, but no finite computation can prove it. From the zeros verified up to height 3 × 10^12 the book certifies that the derivatives of the heat trace have the predicted signs up to order 1.16 × 10^25, and proves that such finite positivity tests cannot settle it: a perturbation of Xi with the same zeros below a large height, and zeros off the line above it, passes them. No proof of the hypothesis is claimed.\n\nNew results: the reciprocal Xi function at x to the power p is hyperbolically completely monotone exactly when the absolute value of p is at most one minus twice the largest zero angle over pi; at the basepoint one the Thorin density is certified smallest at the origin, so the shifted clock is a stable variable plus a generalized gamma convolution; between the basepoints one half and one the shifted clocks are almost generalized gamma convolutions, unconditionally; the clock of Pólya's Bessel function is the hitting time of an explicit diffusion; adjacent real zeros of a polynomial cannot meet under the backward heat flow before an explicit time; and the Pólya law lies within 2 × 10^-6 in total variation of the ferromagnetic laws of Lee and Yang, a distance that is zero exactly under the hypothesis.\n\nLater chapters read the programme through Pólya's papers on the zeros of entire functions (the Pólya Schur form of the hypothesis, Turán inequalities, a certificate that the two sided reciprocal Xi density is log concave and lies within 1.6 × 10^-10 of a Pólya frequency function of every order), Yoshida's Hermitian form of Weil's explicit formula and Zhu's compact windows (a damped Weil criterion, least eigenvalues and an uncertainty barrier), Dedekind zeta functions and the Linnik constant, friable approximants of Xi after Miyatake (truncations of Riemann's theta series to integers built from the first few primes, which agree with Xi to an exponentially small amount and yet leave the real line) with the cosh ladder, the zeros of entire functions in the work of Haseo Ki read through the Thorin programme, hitting times of the reciprocal Xi law (Kent's formula, Jensen and extreme value hitting times, a universal three halves stable limit for prime side hitting times, and what the reciprocal Xi function proves), extreme value laws of Pólya's density with strings and Rouché tests that certify that folded kernels have only real zeros below a height, Weil positivity read as the Thorin condition with Gumbel and Fréchet readings of the explicit formula, the Comtet Majumdar family and the uniform law as a solved model of the Thorin question, truncations of the beta lattice with a drift law for their zeros and the Hermite coefficients of Xi, the completeness of the secant dilates in one weight, the Thorin measure at level one with the backward Cauchy flow (a closed form for the prime side, and a flow that locates the zeros from data on Re s = 1), the complexity and acceleration of that flow with certified positivity of the Thorin density at levels 3/4 and 7/8 up to height 1420, the explicit formula as a deconvolution (a matrix pencil that recovers zeros from the level one density, with 53 zeros certified on the critical line at height 1e13 + 100), Cauchy deconvolution as an ill posed problem, the deconvolution from level one to the critical line (particle filters, contour moments and zero free regions from positivity), and the Balazard, Saias and Yor criterion proved at every level and height and solved by Monte Carlo. The October 2026 claims of a zero free half plane Re s > 7/8 for all L functions, and the later preprints that lower the constant slightly, are not refereed: the book states only conditional consequences (a principal signal for zeta, the sliver and Mertens estimate, the Thorin property at every basepoint above 7/8), credited to their authors.\n\nThe scripts and data files behind the tables and figures are in the book's repository https://github.com/VadimSokolov/computing_rh, listed in code/README.md.",
