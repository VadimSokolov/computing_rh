volumes:                         # one PDF, one DOI and one paperback per volume; the top-level pdf, doi, cover_image and source are Volume I's
  - key: "I"
    subtitle: "Representations of Xi, Thorin Measures and the Reciprocal Xi Function"
    short_description: "The theory: representations of Riemann's Xi function, the Thorin measure whose positivity is equivalent to the Riemann Hypothesis, and the reciprocal Xi function as a generalised gamma convolution."   # the card of this volume on the site's list page
    pdf: pdf/computing_rh_vol1.pdf
    doi: "10.5281/zenodo.23861971"  # zenodo.py reserve --volume I: the next version of the book's Zenodo record (concept DOI 10.5281/zenodo.23331089)
    cover_image: pdf/cover_vol1.jpg
    print_url: ""
    source: {main: main_vol1-kdp.tex, aux: main_vol1-kdp.aux, toc: main_vol1-kdp.toc, pdf: main_vol1-kdp.pdf}
    description: |
      Volume I of Computing the Riemann Hypothesis develops the theory. The Riemann Hypothesis is restated as the positivity of a measure, the Thorin measure of a ratio of values of Riemann's Xi function, and the volume sets out the analytic and probabilistic representations of Xi, infinite divisibility, generalised gamma convolutions and the Bondesson hierarchy, and the reciprocal Xi function as an extended generalised gamma convolution.

      It treats the heat trace and the hierarchy of positivity, weak limits and a Bosch type threshold, the reciprocal zeta function, the basepoint one and hitting times at the basepoints, the critical strip with Riesz's criterion and the squarefree series, the region below the basepoint one, the Dedekind eta function and Dirichlet L functions with the Linnik constant, the completeness of the secant dilates, hitting times and Krein strings with the Pólya Bessel clock, the Pólya density as an extreme value law, ferromagnetic random variables and a two spin Lee and Yang form of the hypothesis, Pólya's work on the zeros of entire functions, and Haseo Ki's work with the Keiper Li coefficients. It ends with a route to the Riemann Hypothesis assembled from the whole book and the open problems of the theory. No proof of the hypothesis is claimed. Volume II, Cauchy Deconvolution and Certified Computation, holds the computations.
  - key: "II"
    subtitle: "Cauchy Deconvolution and Certified Computation"
    short_description: "The computations: Riemann's Xi function in ball arithmetic, the Thorin measure at finite resolution, Cauchy deconvolution, the de Bruijn Newman flow, the barrier method and the Thorin phase diagram."   # the card of this volume on the site's list page
    pdf: pdf/computing_rh_vol2.pdf
    doi: "10.5281/zenodo.23861976"  # zenodo.py reserve --volume II: a record of its own, linked to Volume I's
    cover_image: pdf/cover_vol2.jpg
    print_url: ""
    source: {main: main_vol2-kdp.tex, aux: main_vol2-kdp.aux, toc: main_vol2-kdp.toc, pdf: main_vol2-kdp.pdf}
    description: |
      Volume II of Computing the Riemann Hypothesis holds the computations of the Thorin programme. It asks what computation can and cannot decide about the zeros of the zeta function, evaluates Riemann's Xi function in ball arithmetic, and computes the Thorin measure at finite resolution, the de Bruijn Newman flow from the Pólya density, the barrier method in Thorin form and the Thorin phase diagram.

      Its second part treats Cauchy deconvolution: the deconvolution operator, three families of generalised gamma convolutions and the deconvolution obstruction, deconvolution as a damped Weil criterion, the level one measure and the backward Cauchy flow with its complexity and acceleration, the explicit formula as a deconvolution, particle filters and nested sampling from level one to the critical line, and the Balazard, Saias and Yor criterion by Monte Carlo. Later parts cover Weil positivity in the windows of Yoshida and Zhu, truncations of the Biane Pitman Yor and beta lattices, friable and ferromagnetic approximants of Xi with certified real zeros, the Comtet Majumdar family, approximating clocks, and conditional results under a quasi Riemann hypothesis at 7/8, which rests on preprints that are not refereed. Results computed in ball arithmetic are certified; floating point results are stated as computed. No proof of the hypothesis is claimed. Volume I, Representations of Xi, Thorin Measures and the Reciprocal Xi Function, develops the theory.
