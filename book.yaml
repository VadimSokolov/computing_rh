  format: latex
  dir: .
  main: main_vol1-kdp.tex   # Volume I at 7 x 10 in, digital and print (as in volumes); split_volumes.py --build writes main_vol1.tex and main_vol2.tex from main.tex and its plan, then latexmk builds each -kdp file
