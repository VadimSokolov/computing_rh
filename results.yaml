- id: rigidity_clock_ggc_iff_rh
  name: Rigidity of the clock, a GGC if and only if RH
  label: prop:rigid
  chapter: "1"
  origin: paper:polson2026
  status: proved
  highlight: false
  summary: >-
    The clock, the reciprocal of the normalised completed zeta function in the variable $u=s^2$, is the Laplace transform of a generalised gamma convolution exactly when the Riemann Hypothesis holds, and then its Thorin measure is the sum of unit atoms at the squared ordinates of the zeros.
  statement: >-
    Let $\xi(s)=\frac12 s(s - 1)\pi^{-s/2}\Gamma(s/2)\zeta(s)$ be the completed zeta function, an entire function whose zeros are the nontrivial zeros of $\zeta$, and put $G(u)=\xi(\frac12+\sqrt{u})/\xi(\frac12)$, an entire function of $u$. The clock is the function $1/G$. A random variable $H\ge 0$ is a generalised gamma convolution (GGC) if $\mathbb{E}\,e^{-uH}=\exp\{-du-\int_{(0,\infty)}\log(1+u/z)\,U(dz)\}$ for $u>0$, with a drift $d\ge 0$ and a positive measure $U$ on $(0,\infty)$, the Thorin measure, such that $\int_{(0,1)}|\log z|\,U(dz)+\int_{(1,\infty)}z^{-1}U(dz)<\infty$; the drift and the Thorin measure are unique. Then $1/G$ is the Laplace transform of a GGC if and only if the Riemann Hypothesis (RH) holds, that is, if and only if every zero of $\xi$ has real part $\frac12$. In that case the drift is zero, the Thorin measure is $U_{\mathrm{RH}}=\sum_{\gamma>0}\delta_{\gamma^2}$, where $\frac12+i\gamma$ runs over the zeros of $\xi$ with $\gamma>0$, counted with multiplicity, and the clock variable is $T=\sum_{\gamma>0}e_\gamma/\gamma^2$ with independent standard exponential random variables $e_\gamma$.

- id: shifted_clock_ggc_right_of_every_zero
  name: Shifted clock is a GGC to the right of every zero
  label: thm:poisson
  chapter: "1"
  origin: paper:polson2026
  status: proved
  highlight: false
  summary: >-
    To the right of every zero of the completed zeta function, in particular at every basepoint $\alpha\ge 1$, the shifted clock is the Laplace transform of a generalised gamma convolution with an explicit positive Thorin density, and it is one exactly when $\alpha$ is at least the supremum of the real parts of the zeros.
  statement: >-
    Let $\xi$ be the completed zeta function, and for real $\alpha$ and real $r$ put $v_\alpha(r)=\operatorname{Re}(\xi'/\xi)(\alpha+ir)$. If $\alpha>\operatorname{Re}\rho$ for every zero $\rho$ of $\xi$, in particular for every $\alpha\ge 1$, then $u\mapsto\xi(\alpha)/\xi(\alpha+\sqrt{u})$ is the Laplace transform of a generalised gamma convolution $T_\alpha$ (a random variable $H\ge 0$ with $\mathbb{E}\,e^{-uH}=\exp\{-du-\int_{(0,\infty)}\log(1+u/z)\,U(dz)\}$ for $u>0$, a drift $d\ge 0$ and a positive Thorin measure $U$) whose Thorin measure has density $v_\alpha(\sqrt{z})/(2\pi\sqrt{z})$ with respect to $dz$ on $(0,\infty)$, and $v_\alpha>0$. The function $u\mapsto\xi(\alpha)/\xi(\alpha+\sqrt{u})$ is the Laplace transform of a generalised gamma convolution if and only if $\alpha\ge\sup_\rho\operatorname{Re}\rho$.

- id: one_line_positivity_exclusion_open
  name: Positivity of the Thorin density on one line, open question
  label: rem:ch2:oneline
  chapter: "1"
  origin: book
  status: open
  highlight: false
  summary: >-
    It is not known, without assuming the Riemann Hypothesis, whether nonnegativity of the real part of the logarithmic derivative of the completed zeta function on a single vertical line excludes zeros to the right of that line.
  statement: >-
    Let $\xi$ be the completed zeta function and, for real $\alpha>\frac12$ and real $r$, put $v_\alpha(r)=\operatorname{Re}(\xi'/\xi)(\alpha+ir)$, so that $v_\alpha(r)/\pi$ is the Thorin density at resolution $\alpha - \frac12$. If some zero of $\xi$ has real part greater than $\alpha$, the shifted clock $\xi(\alpha)/\xi(\alpha+\sqrt{u})$ is not the Laplace transform of a generalised gamma convolution. The question is whether, without assuming the Riemann Hypothesis, $v_\alpha(r)\ge 0$ for all real $r$ implies that $\xi$ has no zero with real part greater than $\alpha$. The book states that this is not known for $\xi$. What is known is that if $v_\alpha\ge 0$ for every $\alpha>\sigma_0$ then no zero has real part greater than $\sigma_0$ (for $\sigma_0=\frac12$ this is Lagarias's criterion for RH), and that for an explicit entire function with the order, symmetry and reality of $\xi$ the answer is negative.

- id: tilted_polya_representation_of_xi
  name: Tilted Pólya representation of xi and its derivative
  label: prop:tilt
  chapter: "2"
  origin: book
  status: proved
  highlight: false
  summary: >-
    Moving the line of integration of Pólya's integral into the strip of analyticity of the Pólya kernel gives exact integral formulas for $\xi$ and $\xi'$ on a line at distance $\delta$ from the edge of the strip, with kernel bounds of order $\delta^{-5/2}$.
  statement: >-
    Let $\Phi(u)=2\sum_{n\ge 1}\bigl(2\pi^2n^4e^{9u/2} - 3\pi n^2e^{5u/2}\bigr)\exp(-\pi n^2e^{2u})$ be the Pólya kernel, an even function that is analytic in the strip $|\operatorname{Im}u|<\pi/4$, and let $\xi$ be the completed zeta function, so that $\xi(\frac12+s)=\int_{\mathbb{R}}\Phi(u)e^{su}\,du$. Let $0<\delta<\pi/4$ and $\eta=\pi/4 - \delta$. Then for every complex $s$, $\xi(\frac12+s)=e^{i\eta s}\int_{\mathbb{R}}\Phi(x+i\eta)\,e^{sx}\,dx$ and $\xi'(\frac12+s)=e^{i\eta s}\int_{\mathbb{R}}(x+i\eta)\,\Phi(x+i\eta)\,e^{sx}\,dx$. For real $x$, $|\Phi(x+i\eta)|\le C_\delta$ and $|(x+i\eta)\Phi(x+i\eta)|\le C_\delta$, with $C_\delta=O(\delta^{-5/2})$ as $\delta\to 0$.

- id: thorin_mass_first_order_defect
  name: Mass defect of the Thorin measure on a window
  label: prop:mass
  chapter: "3"
  origin: book
  status: proved
  highlight: false
  summary: >-
    When every zero up to height $\Theta$ lies on the critical line, the Thorin mass of the window $(0,\Theta^2]$ equals the zero count $N(\Theta)$ minus $(\varepsilon/\pi)\,\Xi'(\Theta)/\Xi(\Theta)$ up to a remainder of order $\varepsilon^2$.
  statement: >-
    Let $\xi$ be the completed zeta function, $\Xi(\theta)=\xi(\frac12+i\theta)$, and for $\varepsilon>0$ let $\mu_\varepsilon$ be the signed measure on $(0,\infty)$ whose density in the variable $\theta=\sqrt{z}$ is the Thorin density $\rho_\varepsilon(\theta)=\pi^{-1}\operatorname{Re}(\xi'/\xi)(\frac12+\varepsilon+i\theta)$, so that $\mu_\varepsilon((0,\Theta^2])=\int_0^\Theta\rho_\varepsilon(\theta)\,d\theta$. Let $N(\Theta)$ be the number of zeros $\rho$ of $\xi$ with $0<\operatorname{Im}\rho\le\Theta$, counted with multiplicity. Suppose that $\Theta$ is not the ordinate of a zero and that every zero with $0<\operatorname{Im}\rho\le\Theta$ lies on the line $\operatorname{Re}s=\frac12$. Then $\mu_\varepsilon((0,\Theta^2])=N(\Theta) - \frac{\varepsilon}{\pi}\,\frac{\Xi'(\Theta)}{\Xi(\Theta)}+O(\varepsilon^2)$ as $\varepsilon\downarrow 0$. The book also shows that the remainder is in fact $O(\varepsilon^3)$.

- id: off_line_zero_signatures
  name: Signatures of an off line zero in the Thorin density
  label: prop:signature
  chapter: "3"
  origin: book
  status: proved
  highlight: false
  summary: >-
    The effect of an off line pair of zeros on the Thorin density is computed in closed form: a displacement that keeps the count has total variation $\frac{3\sqrt{3}}{4\pi}(\delta/\varepsilon)^2$ per displaced zero to leading order for $\delta<\varepsilon$, an omitted pair has total variation $\frac4\pi\arcsin(\varepsilon/\delta)$, and a displaced zero has negative mass $\frac1\pi\arcsin(\varepsilon/\delta)$, the last two for $\delta>\varepsilon$; the quadratic growth of the first is the square root law of Polson (2026).
  statement: >-
    Let $P_a(x)=a/(\pi(a^2+x^2))$ for $a>0$ be the Poisson (Cauchy) kernel, $P_{-a}=-P_a$, and $P_0$ the unit point mass at the origin, and write $\|\cdot\|_{\mathrm{TV}}$ for the total variation norm on $\mathbb{R}$. For $\varepsilon>0$ the Thorin density $\rho_\varepsilon(\theta)=\pi^{-1}\operatorname{Re}(\xi'/\xi)(\frac12+\varepsilon+i\theta)$ of the completed zeta function $\xi$ is a sum over the zeros $\rho=\beta+i\gamma$ with $\gamma>0$ of kernels $P_{1/2+\varepsilon - \beta}(\theta - \gamma)$ together with their reflections at $-\gamma$: a zero on the line $\operatorname{Re}s=\frac12$ with ordinate $\gamma$ contributes $P_\varepsilon$ centred at $\gamma$, and a pair of off line zeros $\frac12\pm\delta+i\gamma$ with $0<\delta<\frac12$ contributes $P_{\varepsilon+\delta}+P_{\varepsilon - \delta}$ centred at $\gamma$. Let $\varepsilon>0$ and $0<\delta<\frac12$. (i) If two line zeros at height $\gamma$ are replaced by the quadruple $\frac12\pm\delta\pm i\gamma$, the density near $\gamma$ changes by $2g$, where $g=\frac12(P_{\varepsilon+\delta}+P_{\varepsilon - \delta}) - P_\varepsilon$ is the change per displaced zero, and for $\delta<\varepsilon$, $\|g\|_{\mathrm{TV}}=\frac{3\sqrt{3}}{4\pi}(\delta/\varepsilon)^2+O(\delta^4/\varepsilon^4)$. (ii) If the pair $\frac12\pm\delta+i\gamma$ exists but a list of line zeros omits it, the difference is $P_{\varepsilon+\delta}+P_{\varepsilon - \delta}$, and its total variation norm is $2$ for $\delta\le\varepsilon$ and $\frac8\pi\arctan\sqrt{(\delta+\varepsilon)/(\delta - \varepsilon)} - 2=\frac4\pi\arcsin(\varepsilon/\delta)$ for $\delta>\varepsilon$. (iii) For $\delta>\varepsilon$ the negative part of $\frac12(P_{\varepsilon+\delta}+P_{\varepsilon - \delta})$, the density of one displaced zero, has mass $\frac2\pi\arctan\sqrt{(\delta+\varepsilon)/(\delta - \varepsilon)} - \frac12=\frac1\pi\arcsin(\varepsilon/\delta)=\frac{\varepsilon}{\pi\delta}+O(\varepsilon^3/\delta^3)$. The expansion $g=\frac{\delta^2}{2}\,\partial_a^2P_a|_{a=\varepsilon}+O(\delta^4)$ behind (i), by which the signature grows like the square of the displacement, is Proposition 19.7 of Polson (2026).

- id: littlewood_identity_thorin_mass
  name: Littlewood identity for the cumulative Thorin mass
  label: prop:littlewood
  chapter: "3"
  origin: book
  status: proved
  highlight: false
  summary: >-
    The cumulative Thorin mass at resolution $\varepsilon$ is $\pi^{-1}$ times the derivative in $\varepsilon$ of the integral of $\log|\xi|$ along the line $\operatorname{Re}s=\frac12+\varepsilon$, which links the mass to the integral of $\log|\xi|$ on the critical line.
  statement: >-
    Let $\xi$ be the completed zeta function and, for $\varepsilon>0$ and $T>0$, let $M_\varepsilon(T)=\pi^{-1}\int_0^T\operatorname{Re}(\xi'/\xi)(\frac12+\varepsilon+it)\,dt$ be the cumulative Thorin mass at resolution $\varepsilon$ up to height $T$; it equals $\pi^{-1}\arg\xi(\frac12+\varepsilon+iT)$, with the argument continued along the vertical line from the real axis, where $\xi>0$. Let $T>0$. For every $\varepsilon>0$ such that $\xi$ has no zero on the segment from $\frac12+\varepsilon$ to $\frac12+\varepsilon+iT$, $\pi M_\varepsilon(T)=\frac{\partial}{\partial\varepsilon}\int_0^T\log\bigl|\xi(\frac12+\varepsilon+it)\bigr|\,dt$, and for every $\varepsilon>0$, $\int_0^T\log\bigl|\xi(\frac12+\varepsilon+it)\bigr|\,dt=\int_0^T\log\bigl|\xi(\frac12+it)\bigr|\,dt+\pi\int_0^\varepsilon M_{\varepsilon'}(T)\,d\varepsilon'$, where $M_{\varepsilon'}(T)$ is defined except for the finitely many $\varepsilon'$ at which the segment meets a zero.

- id: zero_density_identity_thorin_mass
  name: Zero density identity from the Thorin mass
  label: prop:zerodensity
  chapter: "3"
  origin: book
  status: proved
  highlight: false
  summary: >-
    The cumulative Thorin mass at resolution $\varepsilon$ plus a short horizontal correction equals the zero count $N(T)$ minus twice the number of zeros to the right of the line $\operatorname{Re}s=\frac12+\varepsilon$, and at $\varepsilon=\frac12$ it is Backlund's unconditional count of $N(T)$.
  statement: >-
    Let $\xi$ be the completed zeta function. For $\varepsilon>0$ and $T>0$ let $M_\varepsilon(T)=\pi^{-1}\arg\xi(\frac12+\varepsilon+iT)$ be the cumulative Thorin mass, the argument being continued along the vertical line from the real axis, where $\xi>0$, and let $\tau_\varepsilon(T)$ be $\pi^{-1}$ times the change of $\arg\xi$ along the horizontal segment from $\frac12+\varepsilon+iT$ to $\frac12+iT$. Let $N(T)$ be the number of zeros $\rho$ with $0<\operatorname{Im}\rho\le T$, and $\nu(\sigma,T)$ the number of those with $\operatorname{Re}\rho>\sigma$, both counted with multiplicity. Let $\varepsilon>0$ and $T>0$, with $T$ not the ordinate of a zero and no zero of $\xi$ on the segment from $\frac12+\varepsilon$ to $\frac12+\varepsilon+iT$. Then $M_\varepsilon(T)+\tau_\varepsilon(T)=N(T) - 2\,\nu(\frac12+\varepsilon,T)$. The segment condition holds at $\varepsilon=\frac12$, and $\nu(1,T)=0$, which gives the unconditional count $N(T)=M_{1/2}(T)+\tau_{1/2}(T)$, and $\nu(\frac12+\varepsilon,T)=\frac12\,[N(T) - M_\varepsilon(T) - \tau_\varepsilon(T)]$ for every $\varepsilon$ satisfying the hypotheses.

